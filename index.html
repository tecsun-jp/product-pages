<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="徳勝商店が厳選した商品のご案内です。">
  <meta name="theme-color" content="#f7f4ec">
  <title>徳勝商店｜商品案内</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="catalog">
    <header class="catalog-header">
      <div class="brand-mark" aria-hidden="true"></div>
      <p class="eyebrow">TOKUSHOU SHOUTEN</p>
      <h1>徳勝商店の商品案内</h1>
      <p class="lead">中国各地から厳選した、本格食材をご紹介します。</p>
    </header>

    <section aria-labelledby="products-title">
      <div class="section-title">
        <h2 id="products-title">商品一覧</h2>
        <span>PRODUCTS</span>
      </div>

      <div class="product-grid">
        <a class="product-card" href="./kogiwa-corn-noodles/">
          <div class="product-image">
            <img
              src="./kogiwa-corn-noodles/assets/kogiwa-corn-noodles.jpg"
              alt="興宜和KOGIWA とうもろこし麺"
              width="1254"
              height="1254"
            >
            <span>300g</span>
          </div>
          <div class="product-info">
            <p>興宜和 KOGIWA</p>
            <h3>とうもろこし麺</h3>
            <small lang="zh">玉米面条</small>
          </div>
          <span class="card-arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>

    <footer>
      <span>徳勝商店</span>
      <span aria-hidden="true">・</span>
      <span>TOKUSHOU SHOUTEN</span>
    </footer>
  </main>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"b49aadbc8c314302b467062abf540f5f"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
