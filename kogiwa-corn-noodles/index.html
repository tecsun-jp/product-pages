<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="興宜和KOGIWA とうもろこし麺の購入先と、徳勝商店のご案内です。">
  <meta name="theme-color" content="#f8f5ed">
  <title>興宜和KOGIWA｜とうもろこし麺</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div class="brand-kicker">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>徳勝商店セレクト</span>
      </div>

      <h1>
        毎日の食卓に、<br>
        <span>とうもろこしの彩り。</span>
      </h1>

      <p class="product-name">
        興宜和 <strong>KOGIWA</strong>
        <span>とうもろこし麺 <span lang="zh">玉米面条</span></span>
      </p>

      <figure class="product-visual">
        <img
          src="assets/kogiwa-corn-noodles.jpg"
          alt="興宜和KOGIWAのとうもろこし麺、調理例と商品パッケージ"
          width="1254"
          height="1254"
        >
        <figcaption>
          <span>とうもろこし麺</span>
          <strong>300g</strong>
        </figcaption>
      </figure>

      <div class="introduction">
        <span class="intro-label">ABOUT</span>
        <p>
          とうもろこし麺をお届けする徳勝商店です。<br>
          ご興味をお持ちいただき、ありがとうございます。<br>
          とうもろこし麺のほか、中国各地の本格食材も<br class="desktop-break">
          厳選して取りそろえております。
        </p>
      </div>
    </header>

    <section class="store-section" aria-labelledby="store-title">
      <div class="section-heading">
        <span>ONLINE STORE</span>
        <h2 id="store-title">購入先を選ぶ</h2>
      </div>

      <nav class="store-links" aria-label="購入先と店舗情報">
        <a class="store-card amazon" href="https://amzn.asia/d/0fEVBLYU" target="_blank" rel="noopener noreferrer">
          <span class="logo-frame">
            <img src="assets/amazon-logo.jpeg" alt="Amazon" width="400" height="400">
          </span>
          <span class="link-copy">
            <strong>Amazonで購入する</strong>
            <small>Amazonの商品ページ</small>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <a class="store-card rakuten" href="https://www.rakuten.co.jp/tokushoushouten/" target="_blank" rel="noopener noreferrer">
          <span class="logo-frame">
            <img src="assets/rakuten-logo.png" alt="楽天市場" width="448" height="448">
          </span>
          <span class="link-copy">
            <strong>楽天市場で購入する</strong>
            <small>徳勝商店 楽天市場店</small>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <a class="store-card mmart" href="https://www.m-mart.co.jp/rep/item/detail/tecsun/1" target="_blank" rel="noopener noreferrer">
          <span class="logo-frame wide-logo">
            <img src="assets/mmart-logo.png" alt="Mマート" width="512" height="512">
          </span>
          <span class="link-copy">
            <strong>業務用・法人のお客様はこちら</strong>
            <small>Mマートの商品ページ</small>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <a class="store-card official" href="http://www.tecsun.co.jp/services/ec" target="_blank" rel="noopener noreferrer">
          <span class="logo-frame globe-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="presentation">
              <circle cx="24" cy="24" r="15"></circle>
              <path d="M9 24h30M24 9c4.3 4.2 6.5 9.2 6.5 15S28.3 34.8 24 39M24 9c-4.3 4.2-6.5 9.2-6.5 15S19.7 34.8 24 39"></path>
            </svg>
          </span>
          <span class="link-copy">
            <strong>当店について</strong>
            <small>徳勝商店 公式サイト</small>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </section>

    <footer>
      <span>徳勝商店</span>
      <span class="footer-separator" aria-hidden="true"></span>
      <span>TOKUSHOU SHOUTEN</span>
    </footer>
  </main>
</body>
</html>
