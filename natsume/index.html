<head>

  <meta name="description" content="徳勝商店の種抜きなつめと特級なつめ。食べやすい紅なつめと、実の大きな駿棗をご案内します。">
  <meta name="theme-color" content="#f7f4ef">
  <title>なつめ二種｜徳勝商店</title>
  <link rel="icon" href="../assets/tokushou-logo.png">
  <link rel="stylesheet" href="../product.css">
  <link rel="stylesheet" href="style.css">

<body>
  <main class="page-shell">
    <h1 class="visually-hidden">なつめ二種</h1>
    <section class="pair" aria-label="なつめ二種">
      <article class="date-card pitted" id="pitted-red-dates">
        <figure class="product-visual">
          <img
            src="../pitted-red-dates/assets/product.jpg"
            alt="興宜和KOGIWAの種抜きなつめ"
            width="1254"
            height="1254"
          >
        </figure>
        <div class="date-copy">
          <p class="date-kicker">興宜和 KOGIWA</p>
          <h2>種抜きなつめ</h2>
          <p class="date-zh" lang="zh">去核红枣 ・ 210g</p>
          <p class="date-lead">種を取った紅なつめ。果肉はふっくら、甘みはまろやかです。</p>
          <a class="detail-link" href="../pitted-red-dates/">この商品の紹介を見る</a>
        </div>
        <nav class="buy-links" aria-label="種抜きなつめの購入先">
          <a class="store-card amazon" href="https://www.amazon.co.jp/dp/B0G1MB3ZZM?th=1" target="_blank" rel="noopener noreferrer">
            <span class="logo-frame">
              <img src="../kogiwa-corn-noodles/assets/amazon-logo.jpeg" alt="Amazon" width="400" height="400">
            </span>
            <span class="link-copy">
              <strong>Amazonで購入する</strong>
              <small>種抜きなつめ</small>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
          <a class="store-card rakuten" href="https://item.rakuten.co.jp/tokushoushouten/50-04/" target="_blank" rel="noopener noreferrer">
            <span class="logo-frame">
              <img src="../kogiwa-corn-noodles/assets/rakuten-logo.png" alt="楽天市場" width="448" height="448">
            </span>
            <span class="link-copy">
              <strong>楽天市場で購入する</strong>
              <small>種抜きなつめ</small>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </nav>
      </article>

      <article class="date-card junzao" id="junzao-dates">
        <figure class="product-visual">
          <img
            src="../junzao-dates/assets/product.jpg"
            alt="興宜和KOGIWAの特級なつめ"
            width="1295"
            height="1214"
          >
        </figure>
        <div class="date-copy">
          <p class="date-kicker">興宜和 KOGIWA</p>
          <h2>特級なつめ</h2>
          <p class="date-zh" lang="zh">特级骏枣 ・ 500g</p>
          <p class="date-lead">実の大きな駿棗。ひと粒で、自然な甘みが広がります。</p>
          <a class="detail-link" href="../junzao-dates/">この商品の紹介を見る</a>
        </div>
        <nav class="buy-links" aria-label="特級なつめの購入先">
          <a class="store-card amazon" href="https://www.amazon.co.jp/dp/B0H5M9L9HR?th=1" target="_blank" rel="noopener noreferrer">
            <span class="logo-frame">
              <img src="../kogiwa-corn-noodles/assets/amazon-logo.jpeg" alt="Amazon" width="400" height="400">
            </span>
            <span class="link-copy">
              <strong>Amazonで購入する</strong>
              <small>特級なつめ</small>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
          <a class="store-card rakuten" href="https://item.rakuten.co.jp/tokushoushouten/50-02/" target="_blank" rel="noopener noreferrer">
            <span class="logo-frame">
              <img src="../kogiwa-corn-noodles/assets/rakuten-logo.png" alt="楽天市場" width="448" height="448">
            </span>
            <span class="link-copy">

              <small>特級なつめ</small>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </nav>
      </article>

    <section class="store-section" aria-labelledby="store-title">
      <div class="section-heading">
        <span>ABOUT US</span>
        <h2 id="store-title">当店について</h2>
      </div>

      <nav class="store-links" aria-label="店舗情報">
        <a class="store-card official" href="http://www.tecsun.co.jp/services/ec" target="_blank" rel="noopener noreferrer">
          <span class="logo-frame globe-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="presentation">
              <circle cx="24" cy="24" r="15"></circle>
              <path d="M9 24h30M24 9c4.3 4.2 6.5 9.2 6.5 15S28.3 34.8 24 39M24 9c-4.3 4.2-6.5 9.2-6.5 15S19.7 34.8 24 39"></path>
            </svg>
          </span>
          <span class="link-copy">
            <strong>当店について</strong>

          </span>
          <span class="arrow" aria-hidden="true">↗</span>

    <footer>
      <span>徳勝商店</span>
      <span class="footer-separator" aria-hidden="true"></span>
      <span>TOKUSHOU SHOUTEN</span>
